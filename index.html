    <title>時刻表｜東武バス川越02・東武東上線</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      :root {
        --bg: #eef1f4;
        --surface: #ffffff;
        --surface-2: #f4f6f8;
        --ink: #17222e;
        --ink-2: #4c5a68;
        --ink-3: #8494a3;
        --line: #d9e0e7;
        --navy: #123a5f;
        --navy-ink: #ffffff;
        --accent: #e86a17;
        --accent-soft: #fdf0e4;
        --next-bg: #123a5f;
        --next-ink: #ffffff;
        --chip-bg: #eef2f6;
        --tag-bg: #e86a17;
        --tag-ink: #ffffff;
        --night-bg: #33475e;
        --night-ink: #ffffff;
        --shadow: 0 1px 3px rgba(18, 42, 66, .10), 0 4px 14px rgba(18, 42, 66, .06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d141b;
          --surface: #16212c;
          --surface-2: #1b2836;
          --ink: #e8eef4;
          --ink-2: #a9b8c6;
          --ink-3: #71848f;
          --line: #2a3948;
          --navy: #1d4e79;
          --accent: #f07f2e;
          --accent-soft: #3a2a1a;
          --next-bg: #1d4e79;
          --chip-bg: #22303f;
          --night-bg: #49637e;
          --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", sans-serif;
        line-height: 1.5;
      }
      .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 40px; }

      /* ---------- Header ---------- */
      header {
        background: var(--navy);
        color: var(--navy-ink);
        margin: 0 -14px;
        padding: 18px 14px 16px;
      }
      .head-inner { max-width: 640px; margin: 0 auto; }
      .route-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .route-badge {
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: .04em;
        padding: 3px 10px;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      .head-title { font-size: 19px; font-weight: 700; letter-spacing: .02em; }
      .head-sub { margin-top: 6px; font-size: 13px; opacity: .85; }
      .clock { margin-top: 2px; font-size: 12.5px; opacity: .7; font-variant-numeric: tabular-nums; }

      /* ---------- Tabs ---------- */
      .tabs-block { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 12px 0 8px; }
      .seg {
        display: flex; gap: 4px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px;
      }
      .seg + .seg { margin-top: 8px; }
      .seg button {
        flex: 1 1 0;
        appearance: none; border: 0; background: transparent;
        color: var(--ink-2);
        font: inherit; font-size: 14px; font-weight: 600;
        padding: 8px 6px;
        border-radius: 7px;
        cursor: pointer;
        min-height: 44px;
        line-height: 1.3;
      }
      .seg button .seg-sub { display: block; font-size: 11px; font-weight: 500; color: var(--ink-3); margin-top: 1px; }
      .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
      .seg button[aria-selected="true"] .seg-sub { color: var(--ink-2); }
      .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .today-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: 2px; }
      .today-dot[hidden] { display: none; }

      /* ---------- Next bus banner ---------- */
      .next-banner {
        background: var(--next-bg); color: var(--next-ink);
        border-radius: 12px;
        padding: 14px 16px;
        margin: 6px 0 12px;
        display: none;
      }
      .next-banner.show { display: block; }
      .next-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; opacity: .8; }
      .next-main { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
      .next-time { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
      .next-away { font-size: 16px; font-weight: 700; }
      .next-dest { font-size: 13px; opacity: .85; }
      .next-after { margin-top: 6px; font-size: 12.5px; opacity: .75; font-variant-numeric: tabular-nums; }

      /* ---------- Summary strip ---------- */
      .summary {
        display: flex; gap: 8px; flex-wrap: wrap;
        margin: 4px 0 12px;
      }
      .summary .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        flex: 1 1 auto;
        min-width: 96px;
      }
      .stat .k { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .05em; }
      .stat .v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .stat .v small { font-size: 12px; font-weight: 600; color: var(--ink-2); }

      /* ---------- Timetable ---------- */
      .table-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .trow { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
      .trow:last-child { border-bottom: 0; }
      .trow.now-hour { background: var(--accent-soft); }
      .hour {
        flex: 0 0 52px;
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums;
        background: var(--surface-2);
        border-right: 1px solid var(--line);
        padding: 10px 0;
      }
      .hour small { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-left: 1px; }
      .mins { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; align-content: center; }
      .min {
        position: relative;
        font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums;
        background: var(--chip-bg);
        border-radius: 7px;
        padding: 4px 9px;
        min-width: 46px; text-align: center;
        line-height: 1.35;
      }
      .min .tag {
        display: inline-block;
        font-size: 10px; font-weight: 800;
        border-radius: 4px;
        padding: 0 4px;
        margin-left: 4px;
        vertical-align: 3px;
        line-height: 1.6;
      }
      .tag.matsu { background: var(--tag-bg); color: var(--tag-ink); }
      .tag.night { background: var(--night-bg); color: var(--night-ink); }
      .min.past { opacity: .32; }
      .min.next {
        background: var(--accent); color: #fff; font-weight: 800;
        box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
      }
      .min.next .tag.matsu { background: #fff; color: var(--accent); }
      .min.next .tag.night { background: #fff; color: var(--night-bg); }

      /* ---------- Legend / footer ---------- */
      .legend {
        margin-top: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px; color: var(--ink-2);
      }
      .legend h2 { font-size: 13px; margin: 0 0 8px; color: var(--ink); }
      .legend ul { margin: 0; padding: 0; list-style: none; }
      .legend li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
      .legend .tag { display: inline-block; font-size: 10px; font-weight: 800; border-radius: 4px; padding: 0 5px; line-height: 1.7; flex: 0 0 auto; }
      .legend .tag.matsu { background: var(--tag-bg); color: var(--tag-ink); }
      .legend .tag.night { background: var(--night-bg); color: var(--night-ink); }
      .legend .tag.none { background: var(--chip-bg); color: var(--ink-2); border: 1px solid var(--line); }
      footer { margin-top: 16px; font-size: 12.5px; color: var(--ink-2); line-height: 1.7; }
      footer p { margin: 0 0 8px; }
      .home-hint {
        margin-top: 14px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12.5px; color: var(--ink-2);
        background: var(--surface);
      }
      .home-hint strong { color: var(--ink); }
    
      /* --- v3 additions: train chips / 4-route tabs --- */
      #routeSeg button { font-size: 13px; padding: 8px 3px; }
      #routeSeg button .seg-sub { font-size: 10.5px; }
      .min .dst { font-size: 11px; font-weight: 600; color: var(--ink-2); margin-left: 4px; }
      .min.next .dst { color: #fff; }
      .tag.ty { background: var(--navy); color: #fff; }
      .tag.ty.ex { background: var(--accent); color: #fff; }

      .min.next .tag.ty { background: #fff; color: var(--navy); }
      .min.next .tag.ty.ex { background: #fff; color: var(--accent); }
      .min.next .tag.ty.loc { background: #fff; color: var(--navy); }
      .legend .tag.ty { background: var(--navy); color: #fff; }
      .legend .tag.ty.ex { background: var(--accent); color: #fff; }
      .legend .tag.ty.loc { background: var(--chip-bg); color: var(--ink-2); border: 1px solid var(--line); }

      .delay-banner { display: none; margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; background: #fdecea; border: 1.5px solid #d64541; color: #7a1f1c; font-size: 14px; line-height: 1.55; }
      .delay-banner.show { display: block; }

      .delay-banner .db-meta { font-size: 12px; opacity: .85; margin-top: 4px; }
      .delay-banner a { color: #7a1f1c; font-weight: 700; }
      /* --- v3.2 additions: 種別フィルター --- */

      .type-filter.show { display: flex; }
      .type-filter .tf-label { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-right: 2px; }
      .tf-chip { border: 1.5px solid var(--line); background: var(--chip-bg); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
      .tf-chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
      .tf-chip.all { border-style: dashed; }
      .tf-chip.all[aria-pressed="true"] { border-style: solid; }
      .empty-note { padding: 16px; font-size: 14px; color: var(--ink-2); }
    </style>

      var TYPE_ORDER = [["普", "普通"], ["準", "準急"], ["急", "急行"], ["快", "快速急行"], ["TJ", "TJライナー"], ["特", "川越特急"]];
      function typeKey(ty) { return ty === "F" ? "快" : ty; }
      function defaultSel() { var s = {}; TYPE_ORDER.forEach(function (t) { s[t[0]] = true; }); return s; }
      var typeSel = { C: defaultSel(), D: defaultSel() };

        if (savedSel) {
          ["C", "D"].forEach(function (r) {
            if (savedSel[r]) TYPE_ORDER.forEach(function (t) {
              if (typeof savedSel[r][t[0]] === "boolean") typeSel[r][t[0]] = savedSel[r][t[0]];
            });
          });
        }
      } catch (e) {}
      function saveTypeSel() { try { localStorage.setItem("tojoTypeFilters", JSON.stringify(typeSel)); } catch (e) {} }
      function applyFilter(route, type) {
        var table = DATA[route][type];
        if (!DATA[route].train) return table;
        var sel = typeSel[route];
        if (TYPE_ORDER.every(function (t) { return sel[t[0]]; })) return table;
        var out = {};
        Object.keys(table).forEach(function (h) {
          var rows = table[h].filter(function (e) { return sel[typeKey(e.ty)]; });
          if (rows.length) out[h] = rows;
        });
        return out;

      function pad(n) { return (n < 10 ? "0" : "") + n; }

      function sk(h) { return h < 4 ? h + 24 : h; }

      function todayType(now) {
        var dow = now.getDay();
        if (dow === 0 || dow === 6) return "weekend";
        if (HOLIDAYS[dateKey(now)]) return "weekend";
        return "weekday";
      }

      function flatten(route, table) {
        var list = [];
        Object.keys(table).map(Number).sort(function (a, b) { return sk(a) - sk(b); }).forEach(function (h) {
          table[h].forEach(function (e) {
            if (typeof e === "number") {
              list.push({ h: h, m: e, tag: null, tagCls: "", tagTxt: "", dest: DATA[route].destLabel, short: "", dst: "" });

              var cls = "ty" + (e.ty === "TJ" ? " ex" : (e.ty === "普" ? " loc" : ""));
              list.push({
                h: h, m: e.m, tag: "ty", tagCls: cls, tagTxt: e.ty,
                dest: TFULL[e.ty] + " " + e.d + "行き",
                short: "（" + e.ty + " " + e.d + "）", dst: e.d
              });

                tagCls: e.t === "matsu" ? "matsu" : (e.t === "night" ? "night" : ""),

                short: e.t === "matsu" ? "（松）" : (e.t === "night" ? "（深夜）" : ""), dst: ""
              });
            }
          });
        });
        return list;
      }

           '<li>TJライナーは別途座席指定料金が必要です（川越特急は通常運賃のみで乗れます）。</li></ul>',
        D: '<h2>凡例（東上線・川越発）</h2><ul>' +
           '<li><span class="tag ty loc">普</span> 普通 ／ <span class="tag ty">準</span> 準急 ／ <span class="tag ty">急</span> 急行 ／ <span class="tag ty">快</span> 快速急行 ／ <span class="tag ty ex">TJ</span> TJライナー ／ <span class="tag ty">特</span> 川越特急 ／ <span class="tag ty">F</span> Fライナー（副都心線直通の快速急行）</li>' +
           '<li>行き先は池袋のほか、新木場・元町・中華街・湘南台・海老名・武蔵小杉など直通先を含みます。</li>' +
           '<li>Fライナーは「快速急行」として絞り込まれます。</li>' +
           '<li>TJライナーは別途座席指定料金が必要です（川越特急は通常運賃のみで乗れます）。</li></ul>'
      };

      var state = { route: "A", type: null };
      var firstRender = true;

      function $(id) { return document.getElementById(id); }

      function render() {
        var now = new Date();
        var tType = todayType(now);
        var isToday = state.type === tType;
        var route = DATA[state.route];
        var table = applyFilter(state.route, state.type);
        var list = flatten(state.route, table);
        var nowMin = now.getHours() * 60 + now.getMinutes();
        if (now.getHours() < 4) nowMin += 1440;
        var veh = route.train ? "電車" : "バス";

        var nextIdx = -1;
        if (isToday) {
          for (var i = 0; i < list.length; i++) {
            if (sk(list[i].h) * 60 + list[i].m > nowMin) { nextIdx = i; break; }
          }
        }

        // ヘッダー
        $("routeBadge").textContent = route.badge;
        $("headTitle").textContent = route.title;
        $("headSub").textContent = route.headSub;
        var dowNames = ["日", "月", "火", "水", "木", "金", "土"];
        $("clock").textContent =
          now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + dowNames[now.getDay()] + "） " +
          pad(now.getHours()) + ":" + pad(now.getMinutes()) +
          " 現在 ・ 今日は" + (tType === "weekday" ? "平日" : "土曜・日祝") + "ダイヤ";

        // タブ状態
        ["A", "B", "C", "D"].forEach(function (k) {
          $("tabRoute" + k).setAttribute("aria-selected", state.route === k ? "true" : "false");
        });
        $("tabWeekday").setAttribute("aria-selected", state.type === "weekday" ? "true" : "false");
        $("tabWeekend").setAttribute("aria-selected", state.type === "weekend" ? "true" : "false");
        $("dotWeekday").hidden = tType !== "weekday";
        $("dotWeekend").hidden = tType !== "weekend";

        // 次の便バナー
        var banner = $("nextBanner");
        $("nextLabel").textContent = "次の" + veh;
        if (isToday && nextIdx >= 0) {
          var nb = list[nextIdx];
          var away = sk(nb.h) * 60 + nb.m - nowMin;
          banner.classList.add("show");
          $("nextTime").textContent = pad(nb.h) + ":" + pad(nb.m);
          $("nextAway").textContent = away <= 1 ? "まもなく" : "あと約" + away + "分";
          $("nextDest").textContent = nb.dest + (nb.tag === "night" ? "（深夜バス）" : "");
          var after = list.slice(nextIdx + 1, nextIdx + 3).map(function (b) {
            return pad(b.h) + ":" + pad(b.m) + b.short;
          });
          $("nextAfter").textContent = after.length ? "その次： " + after.join(" ・ ") : "この" + veh + "が最終です";
        } else if (isToday && list.length) {
          banner.classList.add("show");
          $("nextTime").textContent = "運行終了";
          $("nextAway").textContent = "";
          $("nextDest").textContent = "本日の" + veh + "は終了しました";
          $("nextAfter").textContent = "";
        } else {
          banner.classList.remove("show");
        }

        // 始発・終発・本数
        if (list.length) {
          var first = list[0], last = list[list.length - 1];
          $("summary").innerHTML =
            '<div class="stat"><div class="k">始発</div><div class="v">' + pad(first.h) + ":" + pad(first.m) + "</div></div>" +
            '<div class="stat"><div class="k">終発</div><div class="v">' + pad(last.h) + ":" + pad(last.m) +
            (last.tag === "night" ? ' <small>深夜バス</small>' : "") + "</div></div>" +
            '<div class="stat"><div class="k">本数</div><div class="v">' + list.length + '<small> 本</small></div></div>';
        } else {
          $("summary").innerHTML =
            '<div class="stat"><div class="k">本数</div><div class="v">0<small> 本</small></div></div>';
        }

        // 時刻表本体
        var html = "";
        var flatIdx = 0;
        Object.keys(table).map(Number).sort(function (a, b) { return sk(a) - sk(b); }).forEach(function (h) {
          var isNowHour = isToday && now.getHours() === h;
          html += '<div class="trow' + (isNowHour ? " now-hour" : "") + '">';
          html += '<div class="hour">' + h + "<small>時</small></div>";
          html += '<div class="mins">';
          table[h].forEach(function (e) {
            var item = list[flatIdx];
            var cls = "min";
            if (isToday) {
              if (flatIdx === nextIdx) cls += " next";
              else if (sk(h) * 60 + item.m <= nowMin) cls += " past";
            }
            var inner = pad(item.m);
            if (item.tagTxt) inner += '<span class="tag ' + item.tagCls + '">' + item.tagTxt + "</span>";
            if (item.dst) inner += '<span class="dst">' + item.dst + "</span>";
            html += '<span class="' + cls + '" data-idx="' + flatIdx + '">' + inner + "</span>";
            flatIdx++;
          });
          html += "</div></div>";
        });
        if (!list.length) html = '<div class="empty-note">選択された種別の電車はありません。上のチップで種別を選んでください。</div>';
        $("tableCard").innerHTML = html;

        // 凡例
        var lg = $("legend");
        lg.innerHTML = LEGENDS[state.route];
        lg.hidden = !LEGENDS[state.route];

        // 運行情報リンクは電車タブのときだけ表示
        $("svcLink").hidden = !route.train;

        // 種別フィルターチップ（電車タブのみ・上下線で別々の選択）
        var tf = $("typeFilter");
        if (route.train) {
          var sel = typeSel[state.route];
          var allOn = TYPE_ORDER.every(function (t) { return sel[t[0]]; });
          var chips = '<span class="tf-label">種別</span>';
          chips += '<button type="button" class="tf-chip all" data-all="1" aria-pressed="' + (allOn ? "true" : "false") + '">すべて</button>';
          TYPE_ORDER.forEach(function (t) {
            chips += '<button type="button" class="tf-chip" data-ty="' + t[0] + '" aria-pressed="' + (sel[t[0]] ? "true" : "false") + '">' + t[1] + "</button>";
          });
          tf.innerHTML = chips;
          tf.classList.add("show");
          tf.querySelectorAll(".tf-chip").forEach(function (chip) {
            chip.addEventListener("click", function () {
              var cur = typeSel[state.route];
              if (chip.getAttribute("data-all")) {
                typeSel[state.route] = defaultSel();
              } else {
                var k = chip.getAttribute("data-ty");
                var wasAll = TYPE_ORDER.every(function (t) { return cur[t[0]]; });
                if (wasAll) {
                  // 全部ONの状態で1つ押したら、その種別だけを表示
                  TYPE_ORDER.forEach(function (t) { cur[t[0]] = t[0] === k; });
                } else {
                  cur[k] = !cur[k];
                  // 全部OFFになったら全部ONに戻す
                  if (TYPE_ORDER.every(function (t) { return !cur[t[0]]; })) typeSel[state.route] = defaultSel();
                }
              }
              saveTypeSel();
              render();
            });
          });
        } else {
          tf.classList.remove("show");
          tf.innerHTML = "";
        }

        // 初回だけ次の便へスクロール
        if (firstRender && isToday && nextIdx >= 0) {
          var el = document.querySelector(".min.next");
          if (el) {
            setTimeout(function () {
              el.scrollIntoView({ block: "center", behavior: "smooth" });
            }, 350);
          }
        }
        firstRender = false;
      }

      ["A", "B", "C", "D"].forEach(function (k) {
        $("tabRoute" + k).addEventListener("click", function () { state.route = k; render(); });
      });
      $("tabWeekday").addEventListener("click", function () { state.type = "weekday"; render(); });
      $("tabWeekend").addEventListener("click", function () { state.type = "weekend"; render(); });

      // 遅延バナー: status.json（自動チェックが更新する）を読み、乱れがある時だけ表示
      function checkDelay() {
        fetch("status.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (s) {
            var b = $("delayBanner");
            if (s && s.status === "disruption" && s.text) {
              var txt = String(s.text).replace(/&/g, "&amp;").replace(/</g, "&lt;");
              var upd = s.updated ? String(s.updated).replace(/</g, "&lt;") + " 時点 ・ " : "";
              b.innerHTML = '<div class="db-title">⚠ 東上線 運行情報</div><div>' + txt + "</div>" +
                '<div class="db-meta">' + upd +
                '<a href="https://www.tobu.co.jp/service_status/" target="_blank" rel="noopener">公式の運行情報を見る</a></div>';
              b.classList.add("show");
            } else {
              b.classList.remove("show");
            }
          })
          .catch(function () {});
      }
      checkDelay();
      setInterval(checkDelay, 60000);

      state.type = todayType(new Date());
      render();
      setInterval(render, 30000);
    </script>
  </body>
</html>
